[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-rag"
version = "0.1.0"
description = "A retrieval-augmented generation engine built from first principles: BM25 + Porter stemmer, HNSW, rank fusion, cross-encoder reranking, grounded citations, and a rigorous evaluation harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "numba>=0.58",
  "torch>=1.13",
  "sentence-transformers>=2.6",
  "scikit-learn>=1.2",
  "anthropic>=0.84",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "httpx>=0.24",
  "threadpoolctl>=3.1",
  "pypdf>=4.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25", "nltk>=3.8", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["sift*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B008", "SIM108", "B905"]
extend-exclude = ["data", "logs"]

[tool.ruff.per-file-ignores]
"tests/*" = ["E501"]
