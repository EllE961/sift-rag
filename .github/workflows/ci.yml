name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" ruff==0.1.11
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Check web modules parse
        run: for f in web/*.js; do node --check "$f"; done
